<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMIÈRE | متجر الأزياء الفاخرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #fafafa; }
        .serif { font-family: 'Playfair Display', serif; }
        .product-card:hover .product-img { transform: scale(1.05); }
        .product-img { transition: transform 0.5s ease; }
    </style>
</head>
<body class="text-gray-800 pb-24">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="toggleCart()" class="relative p-2 text-gray-700 hover:text-black">
                    <i class="fa-solid fa-bag-shopping text-2xl"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-black text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
            
            <div class="text-center">
                <h1 class="serif text-2xl md:text-3xl font-bold tracking-widest text-black">LUMIÈRE</h1>
                <p class="text-[10px] tracking-wider text-gray-500 uppercase">Haute Couture & Fashion</p>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-full border border-emerald-200">
                    <i class="fa-solid fa-circle text-[8px] animate-pulse ml-1"></i> أونلاين
                </span>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="relative bg-black text-white py-12 px-4 mb-8 overflow-hidden">
        <div class="absolute inset-0 opacity-40 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1000&auto=format&fit=crop');"></div>
        <div class="relative max-w-4xl mx-auto text-center z-10 my-4">
            <span class="text-xs uppercase tracking-widest text-gray-300 font-semibold">تشكيلة الموسم الجديد</span>
            <h2 class="serif text-3xl md:text-5xl font-bold my-3 text-amber-100">فخامة وتصاميم تُناسب ذوقكِ</h2>
            <p class="text-sm md:text-base text-gray-300 max-w-xl mx-auto font-light">تصفحي أحدث الموديلات، اختاري مقاسكِ ولونكِ المفضّل وابلغينا بطلبكِ عبر الواتساب فوراً.</p>
        </div>
    </section>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4">

        <!-- Categories Nav -->
        <div class="flex overflow-x-auto gap-2 pb-4 mb-8 scrollbar-none text-sm font-medium border-b border-gray-200">
            <button onclick="filterCategory('all')" class="cat-btn active bg-black text-white px-5 py-2 rounded-full whitespace-nowrap transition-all">الكل</button>
            <button onclick="filterCategory('dresses')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 px-5 py-2 rounded-full border border-gray-200 whitespace-nowrap transition-all">فساتين فاخرة</button>
            <button onclick="filterCategory('blazers')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 px-5 py-2 rounded-full border border-gray-200 whitespace-nowrap transition-all">بلايز وجاكيتات</button>
            <button onclick="filterCategory('abayas')" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 px-5 py-2 rounded-full border border-gray-200 whitespace-nowrap transition-all">عبايات راقية</button>
        </div>

        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Products Generated by JS -->
        </div>
    </main>

    <!-- Shopping Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity">
        <div class="fixed inset-y-0 left-0 max-w-md w-full bg-white shadow-2xl flex flex-col justify-between">
            <!-- Cart Header -->
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-xl text-gray-800"></i>
                    <h3 class="font-bold text-lg text-gray-800">سلة المشتريات</h3>
                </div>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-black p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Cart Items List -->
            <div id="cart-items" class="p-4 flex-1 overflow-y-auto space-y-4">
                <!-- Items inserted dynamically -->
            </div>

            <!-- Cart Footer / Checkout -->
            <div class="p-4 border-t border-gray-100 bg-gray-50 space-y-4">
                <div class="flex justify-between text-base font-bold text-gray-800">
                    <span>الإجمالي التقديري:</span>
                    <span id="cart-total" class="text-emerald-700">0 ج.م</span>
                </div>
                
                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-gray-600">اسم حضرتك والمنطقة:</label>
                    <input type="text" id="client-name" placeholder="مثال: سارة - سوهاج (شارع الجمهورية)" class="w-full text-sm p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                </div>

                <button onclick="sendOrderWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    إرسال الطلب عبر الواتساب مباشرة
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const products = [
            {
                id: 1,
                name: "فستان سهرة روز حرير فاخر",
                category: "dresses",
                price: 1850,
                image: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?q=80&w=800&auto=format&fit=crop",
                sizes: ["S", "M", "L", "XL"],
                colors: ["روز شيفون", "أسود ملكي"]
            },
            {
                id: 2,
                name: "بليزر كلاسيك كوتور بأزرار ذهبية",
                category: "blazers",
                price: 1400,
                image: "https://nancyfashion.net/cdn/shop/files/6_39451807-cc3a-4386-958d-23ce2ccd0fe7.jpg?v=1777382012&width=1024",
                sizes: ["M", "L", "XL"],
                colors: ["أبيض كريمي", "أسود"]
            },
            {
                id: 3,
                name: "عباية مخملية سوداء بالتطريز اليدوي",
                category: "abayas",
                price: 2200,
                image: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?q=80&w=800&auto=format&fit=crop",
                sizes: ["52", "54", "56", "58"],
                colors: ["أسود ملكي"]
            },
            {
                id: 4,
                name: "فستان كاجوال ساتان ناعم",
                category: "dresses",
                price: 1250,
                image: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?q=80&w=800&auto=format&fit=crop",
                sizes: ["S", "M", "L"],
                colors: ["زيتي", "نبيتي"]
            }
        ];

        let cart = [];

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filteredProducts = filter === 'all' ? products : products.filter(p => p.category === filter);

            filteredProducts.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between">
                        <div class="relative overflow-hidden h-80 bg-gray-100">
                            <img src="${p.image}" alt="${p.name}" class="product-img w-full h-full object-cover">
                            <span class="absolute top-3 right-3 bg-black/80 text-white text-[11px] font-semibold px-2.5 py-1 rounded-full">تصميم حصري</span>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-900 text-lg mb-1">${p.name}</h3>
                                <p class="text-emerald-700 font-extrabold text-lg mb-3">${p.price} ج.م</p>
                                
                                <!-- Size & Color Options -->
                                <div class="space-y-2 mb-4">
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs text-gray-500 font-semibold">المقاس:</span>
                                        <select id="size-${p.id}" class="text-xs border border-gray-300 rounded px-2 py-1 focus:outline-none">
                                            ${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs text-gray-500 font-semibold">اللون:</span>
                                        <select id="color-${p.id}" class="text-xs border border-gray-300 rounded px-2 py-1 focus:outline-none">
                                            ${p.colors.map(c => `<option value="${c}">${c}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <button onclick="addToCart(${p.id})" class="w-full bg-black hover:bg-gray-800 text-white text-sm font-semibold py-2.5 rounded-xl transition-colors flex items-center justify-center gap-2">
                                <i class="fa-solid fa-cart-plus"></i> إضـافة للسلة
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-black', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });
            event.target.classList.remove('bg-white', 'text-gray-700');
            event.target.classList.add('bg-black', 'text-white');
            renderProducts(cat);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const size = document.getElementById(`size-${id}`).value;
            const color = document.getElementById(`color-${id}`).value;

            cart.push({ ...product, selectedSize: size, selectedColor: color, cartId: Date.now() });
            updateCart();
            toggleCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const itemsContainer = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total');

            if(cart.length === 0) {
                itemsContainer.innerHTML = '<p class="text-center text-gray-400 py-8">السلة فارغة حالياً.</p>';
                totalContainer.innerText = '0 ج.م';
                return;
            }

            let total = 0;
            itemsContainer.innerHTML = '';
            cart.forEach((item, index) => {
                total += item.price;
                itemsContainer.innerHTML += `
                    <div class="flex items-center gap-3 p-2 bg-gray-50 rounded-lg border border-gray-100">
                        <img src="${item.image}" class="w-14 h-14 object-cover rounded-md">
                        <div class="flex-1">
                            <h4 class="font-bold text-xs text-gray-800">${item.name}</h4>
                            <p class="text-[11px] text-gray-500">المقاس: ${item.selectedSize} | اللون: ${item.selectedColor}</p>
                            <p class="text-xs font-bold text-emerald-700">${item.price} ج.م</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600 p-1">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
            });
            totalContainer.innerText = total + ' ج.م';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function sendOrderWhatsApp() {
            if(cart.length === 0) {
                alert('برجاء إضافة منتجات للسلة أولاً!');
                return;
            }
            const name = document.getElementById('client-name').value || 'عميل محترم';
            let message = `مرحباً LUMIÈRE 🌸، حابب أطلب الموديلات دي:\n\n`;
            let total = 0;

            cart.forEach((item, i) => {
                total += item.price;
                message += `${i+1}. *${item.name}*\n   - المقاس: ${item.selectedSize}\n   - اللون: ${item.selectedColor}\n   - السعر: ${item.price} ج.م\n\n`;
            });

            message += `*الإجمالي:* ${total} ج.م\n`;
            message += `*الاسم/العنوان:* ${name}\n\n`;
            message += `برجاء تأكيد الموعد والتفاصيل! ✨`;

            const encodedMsg = encodeURIComponent(message);
            window.open(`https://wa.me/201279453889?text=${encodedMsg}`, '_blank');
        }

        // Initial Load
        renderProducts();
    </script>
</body>
</html>
